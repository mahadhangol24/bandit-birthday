<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>Happy Birthday Bandit 😎</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090909}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white;overflow:hidden}
.page{position:relative;min-height:100svh;display:grid;place-items:end center;isolation:isolate;background:#090909}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;z-index:-3;animation:zoom 9s ease-in-out infinite alternate}
.shade{position:absolute;inset:0;z-index:-2;background:linear-gradient(to bottom,rgba(0,0,0,.03),rgba(0,0,0,.12) 38%,rgba(0,0,0,.45) 66%,rgba(0,0,0,.94) 94%)}
.crown{position:absolute;top:20%;left:55%;transform:translate(-50%,-50%) rotate(-5deg);font-size:clamp(2.8rem,11vw,5rem);z-index:3;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45));animation:float 2.8s ease-in-out infinite}
.content{width:min(92vw,560px);text-align:center;padding:0 8px calc(34px + env(safe-area-inset-bottom));z-index:4;position:relative;animation:rise .9s ease both}
.eyebrow{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;opacity:.82;margin-bottom:10px}
h1{font-size:clamp(2.45rem,11vw,5rem);line-height:.92;margin:0;font-weight:900;letter-spacing:-.055em;text-shadow:0 5px 28px #000}
.gold{color:#f3c65f}
.nick{margin:12px 0 16px;font:italic 1.3rem Georgia,serif;color:#f3c65f;text-shadow:0 3px 18px #000}
.wave{width:84px;height:4px;margin:0 auto 17px;border-radius:999px;background:linear-gradient(90deg,transparent,#f3c65f,#fff5db,#f3c65f,transparent);animation:pulse 2.2s ease-in-out infinite}
.message{margin:0 auto;max-width:440px;font:1.08rem/1.5 Georgia,serif;text-shadow:0 2px 14px #000}
.soon{display:inline-block;margin-top:17px;padding:10px 16px;border:1px solid rgba(243,198,95,.7);border-radius:999px;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);font-size:.88rem}
.tap{position:absolute;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;font-size:.67rem;letter-spacing:.16em;text-transform:uppercase;opacity:.72;white-space:nowrap;text-shadow:0 2px 8px #000}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
@keyframes zoom{from{transform:scale(1.01)}to{transform:scale(1.045)}}
@keyframes float{0%,100%{transform:translate(-50%,-50%) rotate(-5deg) translateY(0)}50%{transform:translate(-50%,-50%) rotate(-2deg) translateY(-8px)}}
@keyframes pulse{0%,100%{transform:scaleX(.86);opacity:.7}50%{transform:scaleX(1.14);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
</style>
</head>

const c=document.getElementById('confetti'),x=c.getContext('2d');let W,H,p=[];
const cols=['#f3c65f','#fff','#ff5d5d','#54d17a','#5da8ff','#d16cff'];
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}
function m(top=true){return{x:Math.random()*W,y:top?-30-Math.random()*H*.35:Math.random()*H,w:5+Math.random()*7,h:7+Math.random()*11,vy:1.5+Math.random()*2.7,vx:-.8+Math.random()*1.6,r:Math.random()*Math.PI,vr:-.08+Math.random()*.16,col:cols[Math.floor(Math.random()*cols.length)],s:Math.random()*6.28}}
